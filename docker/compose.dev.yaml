# Desarrollo local: solo Postgres con pgvector. El servidor se ejecuta con `pnpm dev`.
name: everglow-agentes-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: ega }
    ports: ["5432:5432"]
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./initdb/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./initdb-dev/02-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
volumes:
  pgdata-dev:
